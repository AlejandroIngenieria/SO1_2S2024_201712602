apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-rust
  namespace: sopes1
spec:
  selector:
    matchLabels:
      app: grpc-rust
  template:
    metadata:
      labels:
        app: grpc-rust
    spec:
      containers:
      - name: grpc-rust
        image: alejandroingenieria/rust-client:0.2
        resources:
          limits:
            memory: "128Mi"
            cpu: "0.1"
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: rust-client-service
  namespace: sopes1
spec:
  selector:
    app: grpc-rust
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: NodePort #ClusterIP
