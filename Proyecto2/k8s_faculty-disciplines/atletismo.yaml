apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-server-atletismo
  namespace: sopes1
spec:
  selector:
    matchLabels:
      app: grpc-server-atletismo
  template:
    metadata:
      labels:
        app: grpc-server-atletismo
    spec:
      containers:
      - name: grpc-server-atletismo
        image: alejandroingenieria/go-server-atletismo:0.2
        resources:
          limits:
            memory: "128Mi"
            cpu: "0.1"
        ports:
        - containerPort: 50052
---
apiVersion: v1
kind: Service
metadata:
  name: go-server-atletismo-service #DNS
  namespace: sopes1
spec:
  selector:
    app: grpc-server-atletismo
  ports:
    - protocol: TCP
      port: 50052
      targetPort: 50052
  type: NodePort #ClusterIP
