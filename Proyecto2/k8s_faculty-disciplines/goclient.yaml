apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-agro
  namespace: sopes1
spec:
  selector:
    matchLabels:
      app: grpc-agro
  template:
    metadata:
      labels:
        app: grpc-agro
    spec:
      containers:
      - name: grpc-agro
        image: alejandroingenieria/go-client:0.2
        resources:
          limits:
            memory: "128Mi"
            cpu: "0.3"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: go-client-service
  namespace: sopes1
spec:
  selector:
    app: grpc-agro
  ports:
    - protocol: TCP
      port: 8080 # Entrada
      targetPort: 8080 # Salida
  type: NodePort #ClusterIP
